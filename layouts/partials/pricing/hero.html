{{/* Pricing page hero. */}}
<section class="pricing-inner">
  <div class="container">
    <div class="row">
      <div class="col-lg-8 mx-auto">
        <div class="section-header position-relative text-center">
          <h2 data-editable="text" data-prop="title" data-type="span">{{ .title }}</h2>
          <p data-editable="text" data-prop="description" data-type="text">{{ .description | markdownify }}</p>
        </div>
      </div>
    </div>
  </div>
</section>
