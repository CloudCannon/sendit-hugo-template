{{/* Feature page hero. The effect-4.png shape is decorative and stays read-only. */}}
<section class="feature-hero">
  <div class="container">
    <div class="row align-items-center">
      <div class="col-lg-6">
        <div class="feature-hero-content">
          <h1 class="" data-editable="text" data-prop="title" data-type="span">{{ .title }}</h1>
          <p data-editable="text" data-prop="description" data-type="text">{{ .description | markdownify }}</p>
          <div class="d-block mb-6">
            {{ with .btn }}
            <a href="{{ .link }}" class="btn btn-primary btn-lg"
              data-editable="text" data-prop="btn.text" data-type="span">{{ .text }}</a>
            {{ end }}
          </div>
        </div>
      </div>
      <div class="col-lg-6">
        <div class="feature-hero-banner">
          <img src="{{ .image_path }}" alt="banner-image" loading="lazy"
            data-editable="image" data-prop-src="image_path" />
          <div class="shape">
            <img src="/images/feature/effect-4.png" alt="shape" loading="lazy" />
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
