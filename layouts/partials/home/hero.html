{{/* Home hero. The shape PNGs are decorative and stay read-only. */}}
<section class="hero-two">
  <div class="hero-two-shape">
    <img src="/images/hero/hero-two-shape.png" alt="shape" />
  </div>
  <div class="container-fluid">
    <div class="row align-items-center">
      <div class="col-lg-6">
        <div class="hero-two-content">
          <h1 class="mb-4" data-editable="text" data-prop="title" data-type="span">{{ .title }}</h1>
          <p class="mb-7 w-xxl-80" data-editable="text" data-prop="description" data-type="text">{{ .description | markdownify }}</p>
          <div class="">
            {{ with .link }}
            <a href="{{ .url }}" class="btn btn-primary btn-lg"
              data-editable="text" data-prop="link.text" data-type="span">{{ .text }}</a>
            {{ end }}
          </div>
        </div>
      </div>
      <div class="col-lg-6">
        <div class="hero-two-banner">
          <img src="{{ .image_path }}" alt="hero-two-images"
            data-editable="image" data-prop-src="image_path" />
          <div class="hero-two-banner-shape">
            <img src="/images/hero/hero-three-shape.png" alt="shape" />
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
